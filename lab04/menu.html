<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="description" content="Introduction to basic HTML elements">
    <meta name="keywords" content="HTML, Doctype, Head, Body, Meta, Paragraph, Headings, Strong, Emphasis">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<body>
<style>
  nav ul { /* it can be ul.nav as well */
    list-style-type: none; /* Remove bullet points */
    padding: 0;
    margin: 0;
    overflow: hidden;
  }

  ul.nav li {
    display: inline; /* Display list items in a horizontal line */
    margin-right: 20px; /* Add some spacing between items */
  }

  ul.nav li a {
    text-decoration: none;
    color: #007BFF;
    font-weight: bold;
  }
</style>

<ul class="nav">
  <li><a href="#home">Home</a></li>
  <li><a href="#services">Services</a></li>
  <li><a href="#contact">Contact</a></li>

 
</ul>
</body>
</head>
</html>
